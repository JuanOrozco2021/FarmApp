<div class="page-header">
  <h2>Usuarios</h2>
  <p-button label="Nuevo usuario" icon="pi pi-plus" (onClick)="openCreate()" *ngIf="canManage" />
</div>

<p-message *ngIf="!canManage" severity="info" styleClass="w-full mb-3"
           text="Solo un usuario con permiso de administracion de usuarios puede ver esta pantalla."></p-message>
<p-message *ngIf="canManage && errorMessage()" severity="error" [text]="errorMessage()!" styleClass="w-full mb-3"></p-message>

<p-table *ngIf="canManage" [value]="users" [loading]="loading()" [rowHover]="true" dataKey="id" responsiveLayout="scroll">

  <ng-template pTemplate="header">
    <tr>
      <th>Usuario</th>
      <th>Nombre completo</th>
      <th>Correo</th>
      <th>Roles</th>
      <th>Estado</th>
      <th></th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-user>
    <tr>
      <td>{{ user.username }}</td>
      <td>{{ user.fullName }}</td>
      <td>{{ user.email }}</td>
      <td>
        <p-tag *ngFor="let code of user.roles" [value]="roleName(code)" severity="info" [style]="{ 'margin-right': '4px' }" />
      </td>
      <td>
        <p-tag [value]="user.active ? 'Activo' : 'Inactivo'" [severity]="user.active ? 'success' : 'danger'" />
      </td>
      <td style="white-space:nowrap">
        <p-button icon="pi pi-users" [text]="true" pTooltip="Editar roles" (onClick)="openRoles(user)" />
        <p-button icon="pi pi-key" [text]="true" pTooltip="Resetear contrasena" (onClick)="openReset(user)" />
        <p-button [icon]="user.active ? 'pi pi-ban' : 'pi pi-check'" [text]="true"
                  [pTooltip]="user.active ? 'Desactivar' : 'Activar'" (onClick)="toggleActive(user)" />
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr><td colspan="6">No hay usuarios registrados.</td></tr>
  </ng-template>
</p-table>

<!-- Nuevo usuario -->
<p-dialog header="Nuevo usuario" [(visible)]="showCreateDialog" [modal]="true" [style]="{ width: '30rem' }" (onHide)="showCreateDialog = false">
  <form [formGroup]="createForm" (ngSubmit)="submitCreate()">
    <p-message *ngIf="createError()" severity="error" [text]="createError()!" styleClass="w-full mb-3"></p-message>

    <div class="form-field">
      <label for="c-username">Usuario (para iniciar sesion)</label>
      <input id="c-username" pInputText formControlName="username" />
    </div>
    <div class="form-field" style="margin-top:0.75rem">
      <label for="c-email">Correo</label>
      <input id="c-email" pInputText formControlName="email" />
    </div>
    <div class="form-field" style="margin-top:0.75rem">
      <label for="c-fullName">Nombre completo</label>
      <input id="c-fullName" pInputText formControlName="fullName" />
    </div>
    <div class="form-field" style="margin-top:0.75rem">
      <label for="c-password">Contrasena inicial (minimo 8 caracteres)</label>
      <p-password inputId="c-password" formControlName="password" [feedback]="false" [toggleMask]="true" styleClass="w-full" />
    </div>
    <div class="form-field" style="margin-top:0.75rem">
      <label for="c-roles">Roles</label>
      <p-multiSelect inputId="c-roles" formControlName="roleCodes" [options]="roles" optionLabel="name" optionValue="code"
                     placeholder="Selecciona uno o mas roles" styleClass="w-full" appendTo="body" />
    </div>

    <div class="form-actions">
      <p-button type="submit" label="Crear usuario" [loading]="savingCreate()" />
      <p-button type="button" label="Cancelar" severity="secondary" [text]="true" (onClick)="showCreateDialog = false" />
    </div>
  </form>
</p-dialog>

<!-- Editar roles -->
<p-dialog [header]="'Roles de ' + (rolesTargetUser?.username ?? '')" [(visible)]="showRolesDialog" [modal]="true" [style]="{ width: '26rem' }" (onHide)="showRolesDialog = false">
  <form [formGroup]="rolesForm" (ngSubmit)="submitRoles()">
    <p-message *ngIf="rolesError()" severity="error" [text]="rolesError()!" styleClass="w-full mb-3"></p-message>

    <div class="form-field">
      <label for="r-roles">Roles</label>
      <p-multiSelect inputId="r-roles" formControlName="roleCodes" [options]="roles" optionLabel="name" optionValue="code"
                     placeholder="Selecciona uno o mas roles" styleClass="w-full" appendTo="body" />
    </div>

    <div class="form-actions">
      <p-button type="submit" label="Guardar roles" [loading]="savingRoles()" />
      <p-button type="button" label="Cancelar" severity="secondary" [text]="true" (onClick)="showRolesDialog = false" />
    </div>
  </form>
</p-dialog>

<!-- Resetear contrasena -->
<p-dialog [header]="'Resetear contrasena de ' + (resetTargetUser?.username ?? '')" [(visible)]="showResetDialog" [modal]="true" [style]="{ width: '26rem' }" (onHide)="showResetDialog = false">
  <form [formGroup]="resetForm" (ngSubmit)="submitReset()">
    <p-message *ngIf="resetError()" severity="error" [text]="resetError()!" styleClass="w-full mb-3"></p-message>
    <p class="hint">Se reemplaza la contrasena del usuario de inmediato; comunicale la nueva clave por un medio seguro.</p>

    <div class="form-field">
      <label for="rs-password">Nueva contrasena (minimo 8 caracteres)</label>
      <p-password inputId="rs-password" formControlName="newPassword" [feedback]="false" [toggleMask]="true" styleClass="w-full" />
    </div>

    <div class="form-actions">
      <p-button type="submit" label="Resetear" [loading]="savingReset()" />
      <p-button type="button" label="Cancelar" severity="secondary" [text]="true" (onClick)="showResetDialog = false" />
    </div>
  </form>
</p-dialog>
