<div class="page-header">
  <h2>Ventas</h2>
  <p-button label="Nueva venta" icon="pi pi-plus" (onClick)="goToNew()" />
</div>

<div class="filters">
  <input pInputText type="text" placeholder="Buscar por codigo o cliente..." [(ngModel)]="search" (ngModelChange)="onFilterChange()" />
  <p-dropdown [options]="statusOptions" optionLabel="label" optionValue="value" placeholder="Todos los estados"
              [(ngModel)]="status" (onChange)="onFilterChange()" [showClear]="true" />
</div>

<p-table
  [value]="sales"
  [lazy]="true"
  (onLazyLoad)="load($event)"
  [paginator]="true"
  [rows]="15"
  [totalRecords]="totalRecords"
  [loading]="loading"
  [rowHover]="true"
  dataKey="id"
  responsiveLayout="scroll">

  <ng-template pTemplate="header">
    <tr>
      <th>Codigo</th>
      <th>Cliente</th>
      <th>Fecha</th>
      <th>Total</th>
      <th>Estado</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-sale>
    <tr (click)="goToDetail(sale)" class="clickable-row">
      <td>{{ sale.saleCode }}</td>
      <td>{{ sale.customerName || '—' }}</td>
      <td>{{ sale.createdAt | date: 'medium' }}</td>
      <td>${{ sale.total }}</td>
      <td><p-tag [value]="sale.status" [severity]="statusSeverity(sale.status)" /></td>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr><td colspan="5">No se encontraron ventas.</td></tr>
  </ng-template>
</p-table>
