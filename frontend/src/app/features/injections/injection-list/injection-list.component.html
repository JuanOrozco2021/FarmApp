<div class="page-header">
  <h2>Inyectologia</h2>
  <p-button label="Nuevo registro" icon="pi pi-plus" (onClick)="goToNew()"
            *ngIf="authService.hasPermission('INJECTION_REGISTER')" />
</div>

<div class="filters">
  <input pInputText type="text" placeholder="Buscar por codigo o paciente..." [(ngModel)]="search" (ngModelChange)="onFilterChange()" />
  <p-dropdown [options]="statusOptions" optionLabel="label" optionValue="value" placeholder="Todos los estados"
              [(ngModel)]="status" (onChange)="onFilterChange()" [showClear]="true" />
</div>

<p-table
  [value]="records"
  [lazy]="true"
  (onLazyLoad)="load($event)"
  [paginator]="true"
  [rows]="15"
  [totalRecords]="totalRecords"
  [loading]="loading"
  [rowHover]="true"
  dataKey="id"
  responsiveLayout="scroll">

  <ng-template pTemplate="header">
    <tr>
      <th>Codigo</th>
      <th>Paciente</th>
      <th>Medicamento</th>
      <th>Fecha</th>
      <th>Tarifa</th>
      <th>Estado</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-record>
    <tr (click)="goToDetail(record)" class="clickable-row">
      <td>{{ record.injectionCode }}</td>
      <td>{{ record.patientName }}</td>
      <td>{{ record.medicationName }}</td>
      <td>{{ record.appliedAt | date: 'medium' }}</td>
      <td>${{ record.fee }}</td>
      <td><p-tag [value]="record.status" [severity]="statusSeverity(record.status)" /></td>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr><td colspan="6">No se encontraron registros de inyectologia.</td></tr>
  </ng-template>
</p-table>
