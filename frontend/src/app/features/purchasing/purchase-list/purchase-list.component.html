<div class="page-header">
  <h2>Compras</h2>
  <p-button label="Nueva compra" icon="pi pi-plus" (onClick)="goToNew()"
            *ngIf="authService.hasPermission('PURCHASE_MANAGE')" />
</div>

<div class="filters">
  <input pInputText type="text" placeholder="Buscar por codigo o factura..." [(ngModel)]="search" (ngModelChange)="onFilterChange()" />
  <p-dropdown [options]="statusOptions" optionLabel="label" optionValue="value" placeholder="Todos los estados"
              [(ngModel)]="status" (onChange)="onFilterChange()" [showClear]="true" />
</div>

<p-table
  [value]="purchases"
  [lazy]="true"
  (onLazyLoad)="load($event)"
  [paginator]="true"
  [rows]="15"
  [totalRecords]="totalRecords"
  [loading]="loading"
  [rowHover]="true"
  dataKey="id"
  responsiveLayout="scroll">

  <ng-template pTemplate="header">
    <tr>
      <th>Codigo</th>
      <th>Proveedor</th>
      <th>Factura</th>
      <th>Fecha</th>
      <th>Total</th>
      <th>Estado</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-purchase>
    <tr (click)="goToDetail(purchase)" class="clickable-row">
      <td>{{ purchase.purchaseCode }}</td>
      <td>{{ purchase.supplierName }}</td>
      <td>{{ purchase.invoiceNumber || '—' }}</td>
      <td>{{ purchase.purchaseDate | date: 'mediumDate' }}</td>
      <td>${{ purchase.totalAmount }}</td>
      <td><p-tag [value]="purchase.status" [severity]="statusSeverity(purchase.status)" /></td>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr><td colspan="6">No se encontraron compras.</td></tr>
  </ng-template>
</p-table>
