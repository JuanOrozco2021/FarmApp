spring:
  application:
    name: boticario-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/farmApp_database}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # el esquema SIEMPRE lo controla Flyway, nunca Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: false
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  # framework: confia en X-Forwarded-Proto/Host del proxy que termine TLS en
  # produccion (nginx/traefik en el docker-compose) para que HSTS y el
  # esquema (https) se resuelvan bien detras de un proxy inverso.
  forward-headers-strategy: framework
  error:
    include-message: always
    include-binding-errors: always

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET:change-this-development-only-secret-key-please-min-32-chars}
    access-token-minutes: ${JWT_ACCESS_MINUTES:30}
    refresh-token-days: ${JWT_REFRESH_DAYS:7}
  seed:
    admin-username: ${SEED_ADMIN_USERNAME:admin}
    admin-password: ${SEED_ADMIN_PASSWORD:Admin123!}
    admin-email: ${SEED_ADMIN_EMAIL:admin@boticario.local}

springdoc:
  swagger-ui:
    path: /docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.boticario: INFO
